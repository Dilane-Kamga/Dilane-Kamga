# Renders the GitHub stats + top-languages cards as static SVGs committed to the repo.
# Why an Action instead of the hosted github-readme-stats.vercel.app instance:
# that shared instance is regularly paused / rate-limited (503), whereas a committed
# SVG is served straight from the repo and never breaks. Same renderer, same brand theme.
# Runs with the built-in GITHUB_TOKEN (public stats only) — no personal token needed.
name: GitHub stats cards

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # daily refresh (~06:17 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"
          options: 'username=Dilane-Kamga&show_icons=true&hide_border=false&locale=en&bg_color=0a0f1c&title_color=f59e0b&icon_color=6366f1&text_color=f1f5f9&border_color=334155'

      - name: Generate top-languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"
          options: 'username=Dilane-Kamga&layout=compact&langs_count=8&bg_color=0a0f1c&title_color=f59e0b&text_color=f1f5f9&border_color=334155'

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh GitHub stats cards"
            git push
          fi
