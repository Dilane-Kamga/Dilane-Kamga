# Renders the profile activity card (assets/activity.svg) with scripts/render_activity.py
# (Python standard library only, no third-party action or live service) and commits it,
# so the README never depends on an external instance at render time. Uses the built-in
# GITHUB_TOKEN; no personal access token needed.
#
# Private repositories are counted in the totals but never named: the script keeps public
# repositories only in its per-repository list, and the unit tests run first to hold that.
# If the API errors or answers incompletely, the script exits non-zero without writing and
# the previous card stays in place.
name: Profile activity card

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # daily refresh (~06:17 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the renderer
        run: python3 -I scripts/test_render_activity.py

      - name: Render the activity card
        run: python3 -I scripts/render_activity.py --login Dilane-Kamga --out assets/activity.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the card if it changed
        run: |
          git add assets/activity.svg
          if git diff --cached --quiet; then
            echo "Card unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile activity card"
          git push
